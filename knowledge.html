<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=index.html#knowledge">
    <link rel="canonical" href="index.html#knowledge">
    <title>AI-LINK Group · 知识库</title>
    <script>
    (function () {
        // 兼容旧链接 knowledge/reader.html?id=xxx → index.html?kb=xxx#knowledge
        var id = new URLSearchParams(location.search).get('id')
              || new URLSearchParams(location.search).get('kb');
        location.replace('index.html' + (id ? '?kb=' + encodeURIComponent(id) : '') + '#knowledge');
    })();
    </script>
</head>
<body>
    <p>正在跳转到 <a href="index.html#knowledge">AI-Link 知识库</a>...</p>
</body>
</html>
