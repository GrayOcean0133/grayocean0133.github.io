<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-LINK Group · 知识库</title>
    <link rel="stylesheet" href="../css.css">
    <link rel="stylesheet" href="vendor/katex.min.css">
    <link rel="stylesheet" href="knowledge.css">
    <script>
    (function () {
        var lang = null;
        try { lang = localStorage.getItem('aiLinkLang'); } catch (e) {}
        if (!lang) {
            var b = (navigator.language || 'zh').toLowerCase();
            lang = b.indexOf('en') === 0 ? 'en' : 'zh';
        }
        document.documentElement.setAttribute('data-lang', lang);
        document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
    })();
    </script>
</head>
<body>
    <div class="matrix-grid"></div>
    <div class="reader-progress" id="readerProgress"></div>

    <header>
        <button type="button" class="lang-toggle" aria-label="切换语言 / Switch language">
            <span class="lang-opt" data-lang-set="zh">中</span>
            <span class="lang-sep">|</span>
            <span class="lang-opt" data-lang-set="en">EN</span>
        </button>
        <div class="site-title"><a href="../index.html" class="brand-link">AI-LINK GROUP</a></div>
        <div class="site-subtitle">Think-Build-Connect</div>
        <div class="divider"></div>
        <nav class="nav-links">
            <a href="../index.html#hero"><span class="nav-en">HOME</span> <span class="nav-zh">首页</span></a>
            <a href="../index.html#recruit" class="nav-join"><span class="nav-en">JOIN</span> <span class="nav-zh">招新</span></a>
            <a href="../index.html#departments"><span class="nav-en">DEPARTMENTS</span> <span class="nav-zh">部门</span></a>
            <a href="knowledge.html" class="active"><span class="nav-en">KNOWLEDGE</span> <span class="nav-zh">学习</span></a>
            <a href="../index.html#advisors"><span class="nav-en">ABOUT</span> <span class="nav-zh">关于</span></a>
        </nav>
        <div class="divider"></div>
    </header>

    <main>
        <div class="reader-shell">
            <aside class="reader-toc" id="readerToc" aria-label="目录"></aside>

            <article class="reader-article">
                <div class="reader-breadcrumb">
                    <a href="../index.html"><span class="i18n-zh">首页</span><span class="i18n-en">Home</span></a>
                    <span class="sep">/</span>
                    <a href="knowledge.html"><span class="i18n-zh">知识库</span><span class="i18n-en">Knowledge Base</span></a>
                    <span class="sep">/</span>
                    <span id="readerCrumbDoc"></span>
                </div>

                <div class="reader-head">
                    <h1><span class="i18n-zh" id="readerTitleZh"></span><span class="i18n-en" id="readerTitleEn"></span></h1>
                </div>

                <div class="reader-meta" id="readerMeta"></div>

                <div class="reader-content" id="readerContent"></div>

                <nav class="reader-pager" id="readerPager"></nav>
            </article>
        </div>
    </main>

    <footer>
        <div>2026 AI-LINK GROUP © ALL RIGHTS RESERVED</div>
        <span class="site-url">grayocean0133.github.io</span>
    </footer>

    <script src="vendor/marked.min.js"></script>
    <script src="vendor/katex.min.js"></script>
    <script src="manifest.js"></script>
    <script src="md-reader.js"></script>
    <script src="../effects.js"></script>
</body>
</html>
